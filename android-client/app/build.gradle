plugins {
    id 'com.android.application'
}

android {
    namespace 'com.luke.openstick'
    compileSdk 34

    defaultConfig {
        applicationId 'com.luke.openstick'
        minSdk 19
        targetSdk 19
        versionCode 1
        versionName '0.1.0-readonly'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}

